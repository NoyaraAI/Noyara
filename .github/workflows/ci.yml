name: CI

on:
  pull_request:
  push:
    branches: [main, development, preview]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13
          cache: npm
      - run: npm ci
      - run: npm run check

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose --exclude 'https://www\.linkedin\.com/.*' './**/*.md'
